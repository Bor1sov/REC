<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REC Studio — О нас</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <main class="main-container hidden">
      <!-- ЛОГО -->
      <div class="logo-wrapper">
        <div class="main__container__logo"></div>

        <div class="logo-text">
          <div class="logo-top">
            <span class="rec">REC</span><span class="studio">STUDIO</span>
          </div>
          <div class="logo-sub">PRODUCTION COMPANY</div>
        </div>
      </div>

      <!-- UI -->
      <!-- SETTINGS -->
      <section class="settings">
        <button class="settings__lang-btn">RU</button>
        <button class="settings__valume-btn">
          <img
            src="./assets/ЗВУК.png"
            class="settings__valume-btn__img"
            alt="volume"
          />
        </button>
      </section>

      <!-- MENU -->
      <section class="menu">
        <div class="menu__logo red-logo" alt="logo"></div>
        <div class="menu-block">
          <div class="menu-text">МЕНЮ</div>
          <button class="burger">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </section>

      <section class="content">
        <div class="about about--base">
          <img src="./assets/О нас Моб.jpg" class="about__img" />
        </div>

        <div class="paralax-text">
          <div class="about__background">
            <h1 class="about__title">О НАС</h1>
          </div>

          <div class="about-info">
            <p>
              Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptate
              sit ab ducimus delectus dolorum nam, commodi nobis sequi
              voluptatum aperiam.
            </p>
          </div>
        </div>
      </section>
    </main>

    <script src="./scripts/script.js"></script>
  </body>
</html>
